<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>NetMon</title>
<link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
<header>
  <div class="row">
    <div class="brand"><span class="logo">◉</span> NetMon</div>
    <span class="conn" id="conn"><i></i><span id="connText">…</span></span>
  </div>
  <div class="stats">
    <div class="stat" id="sAl"><b id="nAl">0</b><span>alarms</span></div>
    <div class="stat"><b id="nSw">–</b><span>switches</span></div>
    <div class="stat"><b id="nLk">–</b><span>uplinks</span></div>
  </div>
</header>
<main>
  <h2>Active alarms</h2>
  <div id="alarms"></div>
  <h2>Switches</h2>
  <div id="switches"></div>
  <p class="foot"><a href="/">Open full dashboard</a></p>
</main>
<script src="/static/mobile.js"></script>
</body>
</html>
