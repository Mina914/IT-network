# Local SNMPv3 test agent for development (net-snmp), using the MOCK credentials
# from netmon/credentials.py. Listens on localhost only.
#
#   snmpd -f -C -c docs/dev-snmpd.conf --persistentDir=/tmp/netmon-snmpd
#
agentAddress udp:127.0.0.1:16161
createUser netmon-dev SHA-256 "mock-auth-key-DEV-ONLY" AES "mock-priv-key-DEV-ONLY"
rouser netmon-dev priv
sysName DEV-SW1
