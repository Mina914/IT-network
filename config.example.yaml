# NetMon PRODUCTION configuration
# Copy to /opt/netmon/config.yaml on the production server and edit.
#
# This file contains NO secrets, and NetMon refuses to start if it finds any
# (auth_key, priv_key, password, webhook_url, ${ENV} values, ...).
# SNMPv3 keys are read at start-up from the secrets database (see docs/secrets.md).

environment: production

web:
  host: 0.0.0.0
  port: 8080
  # Link used in email / Teams messages ("Open dashboard")
  dashboard_url: "http://10.10.0.50:8080"

db_path: netmon.db

polling:
  interval_seconds: 30     # full SNMP poll of every switch (syslog gives instant alarms in between)
  fail_threshold: 3        # failed polls in a row before "switch unreachable"

syslog:
  enabled: true
  port: 5514               # switches: logging host <this-server> transport udp port 5514

# Where the SNMPv3 credentials come from (read-only DB account, internal server only).
# The DB driver is installed on the production server after security review.
secrets:
  provider: database
  driver: psycopg                 # DB-API module: psycopg | pymysql | pyodbc | oracledb ...
  connect:                        # passed to driver.connect(); NO password here
    host: 10.10.0.20              # must be an internal address (or listed in allowed_hosts)
    port: 5432
    dbname: secrets
    user: netmon_ro
    sslmode: verify-full
  password_file: netmon-db-password   # systemd LoadCredential name (deploy/netmon.service)
  # password_arg: password            # keyword the driver uses for the password
  # allowed_hosts: [secrets-db.corp.local]
  # snmp_query / secrets_query: override the default SELECTs (see docs/secrets.md)

# SNMPv3 is always authPriv (authentication + encryption) and read-only.
# Allowed: auth SHA / SHA-2, privacy AES. MD5 and DES are refused unless:
allow_weak_crypto: false

# Transport settings only (credentials come from the secrets database)
snmp_defaults:
  timeout: 2
  retries: 1

alerts:
  # uplinks = alarm on switch-to-switch links (learned via CDP), ports whose description
  #           matches the regex below, and switches that stop answering.
  # all     = alarm on EVERY port (very noisy: users turn PCs off every evening).
  alert_on: uplinks
  critical_description_regex: "(?i)uplink|trunk|core|server|ap-|wlc|firewall|fw"
  notify_delay_seconds: 15   # link must stay down this long before email/Teams is sent
  send_recovery: true

  # Email and Teams send monitoring data off this server, so they are OFF by policy.
  # To enable either, an approved security exception is required:
  # security_exception: "SEC-2026-0001"

  email:
    enabled: false
    smtp_host: smtp.yourcompany.local     # internal relay preferred
    smtp_port: 587
    starttls: true
    username: netmon@yourcompany.com      # password = secret 'smtp_password' in the secrets DB
    from: netmon@yourcompany.com
    to:
      - it-network@yourcompany.com

  teams:
    enabled: false                        # URL = secret 'teams_webhook' in the secrets DB

# role: core | distribution | access   floor: number shown on the map
# host: the switch management IP (must be the SOURCE IP of its syslog messages)
devices:
  - { name: CORE-SW1, host: 10.10.0.1,  role: core,   floor: 0 }
  # - { name: CORE-SW2, host: 10.10.0.2,  role: core,   floor: 0 }
  - { name: F1-SW1,   host: 10.10.1.11, role: access, floor: 1 }
  - { name: F1-SW2,   host: 10.10.1.12, role: access, floor: 1 }
  - { name: F2-SW1,   host: 10.10.2.11, role: access, floor: 2 }
  - { name: F2-SW2,   host: 10.10.2.12, role: access, floor: 2 }
  - { name: F3-SW1,   host: 10.10.3.11, role: access, floor: 3 }
  - { name: F3-SW2,   host: 10.10.3.12, role: access, floor: 3 }
  - { name: F4-SW1,   host: 10.10.4.11, role: access, floor: 4 }
  - { name: F4-SW2,   host: 10.10.4.12, role: access, floor: 4 }
  - { name: F5-SW1,   host: 10.10.5.11, role: access, floor: 5 }
  - { name: F5-SW2,   host: 10.10.5.12, role: access, floor: 5 }
  # A switch with its own credential: add a row with device_name = OLD-SW in the
  # secrets database; rows with device_name = '*' are the default for all switches.
